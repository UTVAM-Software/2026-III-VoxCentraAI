<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc">
  <title id="title">Comercios, usuarios y permisos</title>
  <desc id="desc">Modelo de acceso multi-comercio con usuarios Django, roles de plataforma, comercios, membresías, sucursales y alcance de sucursal.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>
    text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#475569}.head{font-size:19px;font-weight:700;fill:white}.field{font-size:15px}.edge{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}.rel{font-size:14px;font-weight:700;fill:#334155}.box{stroke-width:2}
  </style></defs>
  <rect width="1440" height="700" fill="white"/><text x="40" y="45" class="title">Comercios, usuarios y permisos</text><text x="40" y="72" class="sub">Separación entre el panel global y el acceso de cada negocio</text>
  <path class="edge" d="M325 225H375V535H430"/><text x="380" y="385" class="rel">1 usuario / 0..N membresías</text>
  <path class="edge" d="M187 320V475"/><text x="198" y="400" class="rel">0..1 rol global</text>
  <path class="edge" d="M575 320V475"/><text x="590" y="405" class="rel">1 comercio / 0..N miembros</text>
  <path class="edge" d="M720 245H940"/><text x="805" y="232" class="rel">1 comercio / 1..N sucursales</text>
  <path class="edge" d="M760 550H940"/><text x="790" y="537" class="rel">membresía / sucursales permitidas</text>
  <path class="edge" d="M1080 320V475"/><text x="1095" y="405" class="rel">1 sucursal / 0..N accesos</text>

  <g><rect class="box" x="50" y="175" width="275" height="145" rx="8" fill="#eff6ff" stroke="#2563eb"/><path d="M58 175H317Q325 175 325 183V213H50V183Q50 175 58 175" fill="#1d4ed8"/><text x="187" y="201" text-anchor="middle" class="head">USUARIO</text><text x="70" y="244" class="field">PK id_usuario (Django auth_user)</text><text x="70" y="273" class="field">correo, contraseña cifrada, activo</text><text x="70" y="302" class="field">Identidad única en la plataforma</text></g>
  <g><rect class="box" x="50" y="475" width="275" height="130" rx="8" fill="#f5f3ff" stroke="#7c3aed"/><path d="M58 475H317Q325 475 325 483V513H50V483Q50 475 58 475" fill="#6d28d9"/><text x="187" y="501" text-anchor="middle" class="head">ROL_PLATAFORMA</text><text x="70" y="544" class="field">PK/FK id_usuario</text><text x="70" y="573" class="field">rol global, activo</text></g>
  <g><rect class="box" x="430" y="175" width="290" height="145" rx="8" fill="#fff7ed" stroke="#ea580c"/><path d="M438 175H712Q720 175 720 183V213H430V183Q430 175 438 175" fill="#c2410c"/><text x="575" y="201" text-anchor="middle" class="head">COMERCIO</text><text x="450" y="244" class="field">PK id_comercio</text><text x="450" y="273" class="field">nombre, slug único, giro</text><text x="450" y="302" class="field">moneda, zona horaria, estado</text></g>
  <g><rect class="box" x="430" y="475" width="330" height="150" rx="8" fill="#f0fdfa" stroke="#0f766e"/><path d="M438 475H752Q760 475 760 483V513H430V483Q430 475 438 475" fill="#0f766e"/><text x="595" y="501" text-anchor="middle" class="head">MEMBRESIA_COMERCIO</text><text x="450" y="544" class="field">PK id_membresia; FK usuario y comercio</text><text x="450" y="573" class="field">rol: propietario, gerente o vendedor</text><text x="450" y="602" class="field">activo; único por usuario y comercio</text></g>
  <g><rect class="box" x="940" y="175" width="280" height="145" rx="8" fill="#f0fdf4" stroke="#16a34a"/><path d="M948 175H1212Q1220 175 1220 183V213H940V183Q940 175 948 175" fill="#15803d"/><text x="1080" y="201" text-anchor="middle" class="head">SUCURSAL</text><text x="960" y="244" class="field">PK id_sucursal; FK comercio</text><text x="960" y="273" class="field">nombre, dirección, activa</text><text x="960" y="302" class="field">Punto de operación del comercio</text></g>
  <g><rect class="box" x="940" y="475" width="330" height="150" rx="8" fill="#fdf2f8" stroke="#db2777"/><path d="M948 475H1262Q1270 475 1270 483V513H940V483Q940 475 948 475" fill="#be185d"/><text x="1105" y="501" text-anchor="middle" class="head">ALCANCE_SUCURSAL</text><text x="960" y="544" class="field">PK/FK membresía y sucursal</text><text x="960" y="573" class="field">Una fila por sucursal permitida</text><text x="960" y="602" class="field">Restringe el panel del vendedor</text></g>
  <text x="40" y="670" class="sub">El panel global valida ROL_PLATAFORMA; los paneles de negocio validan MEMBRESIA_COMERCIO y, si aplica, ALCANCE_SUCURSAL.</text>
</svg>
