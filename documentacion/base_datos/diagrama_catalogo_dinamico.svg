<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="690" viewBox="0 0 1480 690" role="img" aria-labelledby="title desc">
  <title id="title">Catálogo dinámico multi-comercio</title>
  <desc id="desc">Cada comercio mantiene categorías y productos configurables; cada sucursal publica productos con disponibilidad y precio, y los productos pueden tener grupos de opciones.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>
    text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#475569}.head{font-size:19px;font-weight:700;fill:white}.field{font-size:15px}.edge{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}.rel{font-size:14px;font-weight:700;fill:#334155}.box{stroke-width:2}
  </style></defs>
  <rect width="1480" height="690" fill="white"/><text x="40" y="45" class="title">Catálogo dinámico por comercio y sucursal</text><text x="40" y="72" class="sub">Sin tablas ni campos amarrados a una sola comida, marca o menú</text>
  <path class="edge" d="M310 185H400"/><text x="325" y="172" class="rel">1 comercio / 0..N categorías</text>
  <path class="edge" d="M680 185H820"/><text x="690" y="172" class="rel">1 categoría / 0..N productos</text>
  <path class="edge" d="M180 260V430"/><text x="195" y="355" class="rel">1 comercio / sucursales</text>
  <path class="edge" d="M310 505H400"/><text x="320" y="492" class="rel">sucursal / productos publicados</text>
  <path class="edge" d="M980 295V430"/><text x="995" y="360" class="rel">1 producto / 0..N grupos</text>
  <path class="edge" d="M1120 505H1190"/><text x="1125" y="492" class="rel">1 grupo / 0..N opciones</text>
  <path class="edge" d="M900 295V365H700V430"/><text x="755" y="352" class="rel">precio y disponibilidad por sucursal</text>

  <g><rect class="box" x="50" y="110" width="260" height="150" rx="8" fill="#fff7ed" stroke="#ea580c"/><path d="M58 110H302Q310 110 310 118V148H50V118Q50 110 58 110" fill="#c2410c"/><text x="180" y="136" text-anchor="middle" class="head">COMERCIO</text><text x="70" y="180" class="field">PK id_comercio</text><text x="70" y="209" class="field">nombre, moneda, estado</text><text x="70" y="238" class="field">Dueño del catálogo</text></g>
  <g><rect class="box" x="400" y="110" width="280" height="150" rx="8" fill="#eff6ff" stroke="#2563eb"/><path d="M408 110H672Q680 110 680 118V148H400V118Q400 110 408 110" fill="#1d4ed8"/><text x="540" y="136" text-anchor="middle" class="head">CATEGORIA</text><text x="420" y="180" class="field">PK id_categoria; FK comercio</text><text x="420" y="209" class="field">FK categoría padre opcional</text><text x="420" y="238" class="field">nombre, orden, activa</text></g>
  <g><rect class="box" x="820" y="100" width="320" height="195" rx="8" fill="#f0fdf4" stroke="#16a34a"/><path d="M828 100H1132Q1140 100 1140 108V138H820V108Q820 100 828 100" fill="#15803d"/><text x="980" y="126" text-anchor="middle" class="head">PRODUCTO</text><text x="840" y="170" class="field">PK id_producto; FK comercio y categoría</text><text x="840" y="199" class="field">SKU, nombre, descripción</text><text x="840" y="228" class="field">precio base, activo</text><text x="840" y="257" class="field">SKU único dentro del comercio</text></g>
  <g><rect class="box" x="50" y="430" width="260" height="150" rx="8" fill="#f0fdf4" stroke="#16a34a"/><path d="M58 430H302Q310 430 310 438V468H50V438Q50 430 58 430" fill="#15803d"/><text x="180" y="456" text-anchor="middle" class="head">SUCURSAL</text><text x="70" y="500" class="field">PK id_sucursal</text><text x="70" y="529" class="field">FK comercio; nombre</text><text x="70" y="558" class="field">dirección, activa</text></g>
  <g><rect class="box" x="400" y="430" width="320" height="150" rx="8" fill="#ecfeff" stroke="#0891b2"/><path d="M408 430H712Q720 430 720 438V468H400V438Q400 430 408 430" fill="#0e7490"/><text x="560" y="456" text-anchor="middle" class="head">SUCURSAL_PRODUCTO</text><text x="420" y="500" class="field">PK/FK id_sucursal + id_producto</text><text x="420" y="529" class="field">precio alternativo opcional</text><text x="420" y="558" class="field">disponible en este local</text></g>
  <g><rect class="box" x="820" y="430" width="300" height="160" rx="8" fill="#f5f3ff" stroke="#7c3aed"/><path d="M828 430H1112Q1120 430 1120 438V468H820V438Q820 430 828 430" fill="#6d28d9"/><text x="970" y="456" text-anchor="middle" class="head">GRUPO_OPCION</text><text x="840" y="500" class="field">PK id_grupo; FK producto</text><text x="840" y="529" class="field">nombre, mínimo y máximo</text><text x="840" y="558" class="field">requerido, orden</text></g>
  <g><rect class="box" x="1190" y="430" width="250" height="150" rx="8" fill="#fdf2f8" stroke="#db2777"/><path d="M1198 430H1432Q1440 430 1440 438V468H1190V438Q1190 430 1198 430" fill="#be185d"/><text x="1315" y="456" text-anchor="middle" class="head">OPCION_PRODUCTO</text><text x="1210" y="500" class="field">PK id_opcion; FK grupo</text><text x="1210" y="529" class="field">nombre y precio adicional</text><text x="1210" y="558" class="field">activa, orden</text></g>
  <text x="40" y="640" class="sub">Ejemplos de opciones: tamaño, ingredientes, complementos o cualquier variante que configure el comercio.</text>
</svg>
