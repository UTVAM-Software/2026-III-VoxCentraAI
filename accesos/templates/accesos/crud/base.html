{% extends "cuentas/base.html" %}

{% block title %}{{ title|default:"Gestión" }} · VoxCentraAI{% endblock %}

{% block page_styles %}
<style nonce="{{ csp_nonce }}">
  .crud-toolbar { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:22px; }
  .crud-toolbar-copy { min-width:0; }
  .crud-toolbar .eyebrow { margin:0 0 8px; }
  .crud-toolbar h1 { margin:0; }
  .crud-description { margin:7px 0 0; color:var(--muted); font-size:11px; line-height:1.6; }
  .crud-count { margin:4px 0 0; color:#838894; font-size:10px; }
  .crud-table { min-width:720px; }
  .crud-table td { overflow-wrap:anywhere; }
  .crud-actions { min-width:120px; }
  .crud-actions .button { min-height:30px; padding:0 9px; font-size:9px; }
  .crud-empty { min-height:155px; display:grid; place-items:center; color:#9297a1; text-align:center; font-size:11px; }
  .crud-empty p { max-width:360px; margin:8px 0 0; font-size:10px; }
  .crud-form-card { max-width:860px; }
  .crud-form-card form { margin-top:18px; }
  .crud-form-card > .eyebrow { margin:0 0 8px; }
  .crud-form-card > p { max-width:650px; margin:8px 0 0; font-size:11px; }
  .crud-form-card .actions { margin-top:18px; }
  .crud-danger-copy { margin:10px 0 22px; color:#b4b6bd; font-size:12px; }
  @media (max-width:650px) {
    .crud-toolbar { align-items:flex-start; flex-direction:column; gap:13px; }
    .crud-table { min-width:680px; }
    .crud-form-card { padding:15px; }
  }
</style>
{% endblock %}
