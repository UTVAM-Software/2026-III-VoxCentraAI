<text x="71" y="270" font-family="Arial, sans-serif" font-size="15" fill="#1f2937">correo VARCHAR(254) NULL</text>
<text x="71" y="295" font-family="Arial, sans-serif" font-size="15" fill="#1f2937">creado_en DATETIME</text>
