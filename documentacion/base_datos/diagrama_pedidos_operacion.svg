<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1040" viewBox="0 0 1700 1040" role="img" aria-labelledby="title desc">
  <title id="title">Clientes, interacciones y operación de pedidos</title>
  <desc id="desc">Diagrama conceptual multi-comercio con relaciones y cardinalidades para clientes, llamadas e interacciones, sucursales, pedidos, direcciones, productos, detalles, pagos y auditoría.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#172033}
      .title{font-size:27px;font-weight:700}
      .subtitle{font-size:16px;fill:#475569}
      .head{font-size:18px;font-weight:700;fill:#fff}
      .field{font-size:14px}
      .edge{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}
      .rel{font-size:13px;font-weight:700;fill:#334155}
      .label-bg{fill:#fff;opacity:.96}
      .box{stroke-width:2}
    </style>
  </defs>
  <rect width="1700" height="1040" fill="#fff"/>
  <text x="40" y="45" class="title">Clientes, interacciones y operación de pedidos</text>
  <text x="40" y="73" class="subtitle">Cardinalidades explícitas; cada pedido conserva los datos y precios aplicados en la venta</text>

  <path class="edge" d="M370 185 H420 V440 H370"/>
  <path class="edge" d="M370 225 H475 V480 H580"/>
  <path class="edge" d="M370 440 H520 V550 H580"/>
  <path class="edge" d="M50 225 H25 V800 H50"/>
  <path class="edge" d="M760 275 V420"/>
  <path class="edge" d="M980 495 H1040 V510 H1100"/>
  <path class="edge" d="M1250 275 V410"/>
  <path class="edge" d="M1400 510 H1450"/>
  <path class="edge" d="M780 670 V760"/>
  <path class="edge" d="M980 605 H1025 V835 H1100"/>
  <path class="edge" d="M980 640 H1420 V835 H1450"/>

  <g><rect class="label-bg" x="390" y="285" width="195" height="43" rx="4"/><text x="398" y="303" class="rel">Cliente 0..N interacciones</text><text x="398" y="320" class="rel">Interacción 0..1 cliente</text></g>
  <g><rect class="label-bg" x="390" y="345" width="190" height="43" rx="4"/><text x="398" y="363" class="rel">Cliente 0..N pedidos</text><text x="398" y="380" class="rel">Pedido 0..1 cliente</text></g>
  <g><rect class="label-bg" x="390" y="455" width="182" height="43" rx="4"/><text x="398" y="473" class="rel">Interacción 0..N pedidos</text><text x="398" y="490" class="rel">Pedido 0..1 interacción</text></g>
  <g><rect class="label-bg" x="50" y="680" width="260" height="26" rx="4"/><text x="58" y="699" class="rel">Cliente 1 : 0..N direcciones</text></g>
  <g><rect class="label-bg" x="775" y="322" width="160" height="25" rx="4"/><text x="784" y="340" class="rel">Sucursal 1 : 0..N pedidos</text></g>
  <g><rect class="label-bg" x="985" y="466" width="150" height="25" rx="4"/><text x="993" y="484" class="rel">Pedido 1 : 1..N detalles</text></g>
  <g><rect class="label-bg" x="1260" y="320" width="170" height="43" rx="4"/><text x="1268" y="338" class="rel">Producto 0..N detalles</text><text x="1268" y="355" class="rel">Detalle 0..1 producto</text></g>
  <g><rect class="label-bg" x="1405" y="474" width="155" height="25" rx="4"/><text x="1410" y="492" class="rel">Detalle 1 : 0..N opciones</text></g>
  <g><rect class="label-bg" x="790" y="701" width="185" height="25" rx="4"/><text x="798" y="719" class="rel">Pedido 1 : 0..1 dirección</text></g>
  <g><rect class="label-bg" x="1035" y="790" width="155" height="25" rx="4"/><text x="1043" y="808" class="rel">Pedido 1 : 0..N pagos</text></g>
  <g><rect class="label-bg" x="1120" y="615" width="185" height="25" rx="4"/><text x="1128" y="633" class="rel">Pedido 1 : 0..N eventos</text></g>

  <g><rect class="box" x="50" y="125" width="320" height="135" rx="8" fill="#eff6ff" stroke="#2563eb"/><path d="M58 125 H362 Q370 125 370 133 V163 H50 V133 Q50 125 58 125" fill="#1d4ed8"/><text x="210" y="151" text-anchor="middle" class="head">CLIENTE</text><text x="70" y="195" class="field">PK id_cliente; FK comercio</text><text x="70" y="224" class="field">nombre, teléfono, correo</text><text x="70" y="253" class="field">Teléfono indexado, no único</text></g>
  <g><rect class="box" x="50" y="365" width="320" height="155" rx="8" fill="#f0fdfa" stroke="#0f766e"/><path d="M58 365 H362 Q370 365 370 373 V403 H50 V373 Q50 365 58 365" fill="#0f766e"/><text x="210" y="391" text-anchor="middle" class="head">INTERACCION</text><text x="70" y="435" class="field">PK id_interaccion; FK comercio</text><text x="70" y="464" class="field">canal, sucursal, cliente opcional</text><text x="70" y="493" class="field">estado, inicio/fin y referencia externa</text></g>
  <g><rect class="box" x="50" y="720" width="320" height="160" rx="8" fill="#f8fafc" stroke="#64748b"/><path d="M58 720 H362 Q370 720 370 728 V758 H50 V728 Q50 720 58 720" fill="#475569"/><text x="210" y="746" text-anchor="middle" class="head">DIRECCION_CLIENTE</text><text x="70" y="790" class="field">PK id_direccion; FK cliente</text><text x="70" y="819" class="field">calle, números, colonia, ciudad</text><text x="70" y="848" class="field">código postal, referencias, alias</text><text x="70" y="877" class="field">Dirección guardada para futuras compras</text></g>

  <g><rect class="box" x="580" y="130" width="360" height="145" rx="8" fill="#f0fdf4" stroke="#16a34a"/><path d="M588 130 H932 Q940 130 940 138 V168 H580 V138 Q580 130 588 130" fill="#15803d"/><text x="760" y="156" text-anchor="middle" class="head">SUCURSAL</text><text x="600" y="200" class="field">PK id_sucursal; FK comercio</text><text x="600" y="229" class="field">nombre, dirección, activa</text><text x="600" y="258" class="field">Punto de entrega o recolección</text></g>
  <g><rect class="box" x="580" y="420" width="400" height="250" rx="8" fill="#fff7ed" stroke="#ea580c"/><path d="M588 420 H972 Q980 420 980 428 V458 H580 V428 Q580 420 588 420" fill="#c2410c"/><text x="780" y="446" text-anchor="middle" class="head">PEDIDO</text><text x="600" y="490" class="field">PK id_pedido; FK comercio y sucursal</text><text x="600" y="519" class="field">FK cliente e interacción opcionales</text><text x="600" y="548" class="field">origen, estado, tipo de entrega</text><text x="600" y="577" class="field">moneda, subtotal, descuento, impuestos, total</text><text x="600" y="606" class="field">creador, notas y fechas</text><text x="600" y="635" class="field">Totales y dirección quedan como historial</text><text x="600" y="664" class="field">Una entrega puede requerir dirección</text></g>
  <g><rect class="box" x="580" y="760" width="400" height="150" rx="8" fill="#fff7ed" stroke="#ea580c"/><path d="M588 760 H972 Q980 760 980 768 V798 H580 V768 Q580 760 588 760" fill="#9a3412"/><text x="780" y="786" text-anchor="middle" class="head">DIRECCION_PEDIDO</text><text x="600" y="830" class="field">PK/FK id_pedido</text><text x="600" y="859" class="field">calle, números, colonia, ciudad</text><text x="600" y="888" class="field">código postal y referencias: snapshot</text></g>

  <g><rect class="box" x="1100" y="130" width="300" height="145" rx="8" fill="#f0fdf4" stroke="#16a34a"/><path d="M1108 130 H1392 Q1400 130 1400 138 V168 H1100 V138 Q1100 130 1108 130" fill="#15803d"/><text x="1250" y="156" text-anchor="middle" class="head">PRODUCTO</text><text x="1120" y="200" class="field">FK al catálogo del comercio</text><text x="1120" y="229" class="field">Nombre y precio actuales</text><text x="1120" y="258" class="field">No se elimina la venta histórica</text></g>
  <g><rect class="box" x="1100" y="410" width="300" height="200" rx="8" fill="#eff6ff" stroke="#2563eb"/><path d="M1108 410 H1392 Q1400 410 1400 418 V448 H1100 V418 Q1100 410 1108 410" fill="#1d4ed8"/><text x="1250" y="436" text-anchor="middle" class="head">DETALLE_PEDIDO</text><text x="1120" y="480" class="field">PK id_detalle; FK pedido</text><text x="1120" y="509" class="field">FK producto opcional</text><text x="1120" y="538" class="field">nombre/SKU y precio vendidos</text><text x="1120" y="567" class="field">cantidad y notas</text><text x="1120" y="596" class="field">Snapshots de la venta</text></g>
  <g><rect class="box" x="1450" y="410" width="220" height="200" rx="8" fill="#fdf2f8" stroke="#db2777"/><path d="M1458 410 H1662 Q1670 410 1670 418 V448 H1450 V418 Q1450 410 1458 410" fill="#be185d"/><text x="1560" y="436" text-anchor="middle" class="head">OPCION_DETALLE</text><text x="1468" y="480" class="field">PK id; FK detalle</text><text x="1468" y="509" class="field">FK opción opcional</text><text x="1468" y="538" class="field">grupo y opción snapshot</text><text x="1468" y="567" class="field">precio adicional</text><text x="1468" y="596" class="field">Personalizaciones</text></g>
  <g><rect class="box" x="1100" y="760" width="300" height="150" rx="8" fill="#ecfeff" stroke="#0891b2"/><path d="M1108 760 H1392 Q1400 760 1400 768 V798 H1100 V768 Q1100 760 1108 760" fill="#0e7490"/><text x="1250" y="786" text-anchor="middle" class="head">PAGO</text><text x="1120" y="830" class="field">PK id_pago; FK pedido</text><text x="1120" y="859" class="field">método, importe, estado y fechas</text><text x="1120" y="888" class="field">Intentos o pagos parciales</text></g>
  <g><rect class="box" x="1450" y="760" width="220" height="165" rx="8" fill="#f5f3ff" stroke="#7c3aed"/><path d="M1458 760 H1662 Q1670 760 1670 768 V798 H1450 V768 Q1450 760 1458 760" fill="#6d28d9"/><text x="1560" y="786" text-anchor="middle" class="head">HISTORIAL_PEDIDO</text><text x="1468" y="830" class="field">PK id_evento</text><text x="1468" y="859" class="field">FK pedido; estados</text><text x="1468" y="888" class="field">usuario, fecha y nota</text><text x="1468" y="917" class="field">Auditoría de cambios</text></g>

  <text x="50" y="970" class="subtitle">PK: llave primaria | FK: llave foránea | 0..1: opcional | 0..N: ninguno o varios | 1..N: uno o varios</text>
</svg>
