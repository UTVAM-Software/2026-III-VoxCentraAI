{% extends 'cuentas/base.html' %}

{% block title %}{{ title }} | VoxCentra{% endblock %}

{% block content %}
<section class="card">
    <h1>{{ title }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button type="submit">Guardar</button>
            <a class="button secondary" href="{% url cancel_url_name %}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
