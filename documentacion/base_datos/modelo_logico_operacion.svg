<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1242" viewBox="0 0 1760 1242" role="img" aria-labelledby="title desc">
<title id="title">Modelo lógico: clientes, interacciones y pedidos</title>
<desc id="desc">Tablas relacionales con columnas y referencias de llaves primarias y foráneas.</desc>
<rect width="100%" height="100%" fill="#f5f7fb"/>
<text x="55" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17365d">Modelo lógico: clientes, interacciones y pedidos</text>
<text x="55" y="84" font-family="Arial, sans-serif" font-size="15" fill="#475569">PK = llave primaria · FK = llave foránea · Tipos lógicos mapeados a campos de Django</text>
