{% extends "accesos/crud/base.html" %}

{% block title %}{{ title }} · VoxCentra{% endblock %}

{% block content %}
  <section class="panel">
    <h1>{{ title }}</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="actions">
        <button class="button" type="submit">Guardar</button>
        <a class="button secondary" href="{{ list_url }}">Cancelar</a>
      </div>
    </form>
  </section>
{% endblock %}
