<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VoxCentra{% endblock %}</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f4f6fa; }
    body { margin: 0; }
    header { background: #12243a; color: white; padding: 1rem max(1rem, calc((100% - 1100px) / 2)); }
    header strong { font-size: 1.2rem; }
    nav { display: flex; flex-wrap: wrap; gap: .5rem 1rem; margin-top: .8rem; }
    nav a { color: #dbeafe; text-decoration: none; }
    main { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    section, .notice { background: white; border: 1px solid #dbe2ec; border-radius: .6rem; padding: 1.25rem; }
    h1 { margin-top: 0; }
    a.button, button { display: inline-block; border: 0; border-radius: .35rem; padding: .6rem .9rem; background: #1459a6; color: white; text-decoration: none; cursor: pointer; font: inherit; }
    a.secondary { background: #e8edf5; color: #172033; }
    a.danger, button.danger { background: #a32828; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: .75rem .6rem; text-align: left; border-bottom: 1px solid #e3e8ef; }
    th { background: #f4f6fa; }
    .actions { display: flex; flex-wrap: wrap; gap: .5rem; }
    form p { margin: 0 0 1rem; }
    form label { display: block; margin-bottom: .3rem; font-weight: 600; }
    form input, form textarea, form select { box-sizing: border-box; width: 100%; max-width: 38rem; padding: .55rem; border: 1px solid #aeb9c8; border-radius: .3rem; font: inherit; }
    form input[type=checkbox] { width: auto; }
    .errorlist { color: #a32828; }
    @media (max-width: 650px) { table { display: block; overflow-x: auto; } }
  </style>
</head>
<body>
  <header>
    <strong>VoxCentra</strong>
    <nav aria-label="Módulos">
      <a href="{% url 'comercios:comercio-list' %}">Comercios</a>
      <a href="{% url 'comercios:sucursal-list' %}">Sucursales</a>
      <a href="{% url 'catalogo:categoria-list' %}">Categorías</a>
      <a href="{% url 'catalogo:producto-list' %}">Productos</a>
      <a href="{% url 'catalogo:sucursal-producto-list' %}">Productos por sucursal</a>
      <a href="{% url 'catalogo:grupo-opcion-list' %}">Grupos de opciones</a>
      <a href="{% url 'catalogo:opcion-producto-list' %}">Opciones</a>
      <a href="{% url 'clientes:cliente-list' %}">Clientes</a>
      <a href="{% url 'clientes:direccion-list' %}">Direcciones</a>
    </nav>
  </header>
  <main>
    {% if messages %}
      {% for message in messages %}<p class="notice" role="status">{{ message }}</p>{% endfor %}
    {% endif %}
    <section>{% block content %}{% endblock %}</section>
  </main>
</body>
</html>
