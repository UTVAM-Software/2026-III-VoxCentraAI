<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VoxCentra{% endblock %}</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f5f7fb; }
    body { margin: 0; }
    header { background: #14213d; color: white; padding: 1rem max(1rem, calc((100% - 1100px) / 2)); }
    header strong { margin-right: 1.5rem; }
    header nav { display: inline-flex; gap: 1rem; flex-wrap: wrap; }
    header a { color: white; text-decoration: none; }
    main { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-top: 0; }
    .panel { background: white; border: 1px solid #dce2ed; border-radius: .6rem; padding: 1.25rem; }
    .actions { display: flex; gap: .65rem; align-items: center; }
    .button { display: inline-block; border: 0; border-radius: .35rem; background: #2457c5; color: white; padding: .55rem .85rem; text-decoration: none; font: inherit; cursor: pointer; }
    .button.secondary { background: #596579; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; border-bottom: 1px solid #e5e9f0; padding: .7rem .5rem; vertical-align: top; }
    th { color: #536176; font-size: .9rem; }
    form p { display: grid; gap: .35rem; }
    input, select, textarea { box-sizing: border-box; max-width: 100%; padding: .5rem; border: 1px solid #bbc5d4; border-radius: .3rem; font: inherit; }
    .errorlist { color: #a31d2d; }
    @media (max-width: 700px) { .panel { overflow-x: auto; } }
  </style>
</head>
<body>
  <header>
    <strong>VoxCentra · Gestión</strong>
    <nav>
      {% if request.user.is_superuser %}<a href="{% url 'accesos:rol-list' %}">Roles y accesos</a>{% endif %}
      {% if perms.interacciones.view_interaccion %}<a href="{% url 'interacciones:interaccion-list' %}">Interacciones</a>{% endif %}
      {% if perms.pedidos.view_pedido %}<a href="{% url 'pedidos:pedido-list' %}">Pedidos</a>{% endif %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
